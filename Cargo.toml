[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
atlas-etw = { path = "crates/atlas-etw" }
atlas-proto = { path = "crates/atlas-proto" }
atlas-schema = { path = "crates/atlas-schema" }
blake3 = "1.8"
crc32c = "0.6"
globset = "0.4"
criterion = "0.8"
prost = "0.14"
prost-build = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
proptest = "1.11"
protox = "0.9"
serde_json = "1"
tempfile = "3.27"
thiserror = "2"
uuid = { version = "1.26", features = ["v7"] }
windows = "0.62"
