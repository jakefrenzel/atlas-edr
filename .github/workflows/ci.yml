# CI for every push and pull request. Spec: docs/specs/2026-09-25-scaffolding-design.md section 3.1.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97"

jobs:
  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/atlas-schema/fuzz -> target
            crates/atlas-buffer/fuzz -> target
            crates/atlas-etw/fuzz -> target
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Each fuzz crate is its own workspace, so the commands above don't build them.
      - run: cargo check --manifest-path crates/atlas-schema/fuzz/Cargo.toml
      - run: cargo check --manifest-path crates/atlas-buffer/fuzz/Cargo.toml
      - run: cargo check --manifest-path crates/atlas-etw/fuzz/Cargo.toml

  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Tier 3 (sensor spec §12.3): real ETW sessions. The hosted runner's account is an
  # administrator, which starting sessions needs. The run also records the scenario's
  # events as replay fixtures (§12.2): download the artifact, review it, and commit it
  # as crates/atlas-etw/tests/fixtures/scenario.jsonl.
  etw-live:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - name: Live sessions
        shell: bash
        env:
          ATLAS_ETW_RECORD: ${{ runner.temp }}/etw/scenario.jsonl
          ATLAS_ETW_REPORT: ${{ runner.temp }}/etw/report.json
        run: |
          mkdir -p "$RUNNER_TEMP/etw"
          cargo test -p atlas-etw --test live -- --ignored --test-threads=1 --nocapture
      - name: Upload the recording and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: etw-live
          path: ${{ runner.temp }}/etw/
          if-no-files-found: ignore

  # Tier 3 for atlas-agent's Windows services (plan 1b-3b): the tests that need
  # SeDebugPrivilege or SeBackupPrivilege (seeding from the handle table, value
  # reads with backup semantics, the System process's creation time). They are
  # #[ignore]d locally; the hosted runner's account is an administrator. Plan
  # 1b-3c adds the agent-level live test here.
  agent-live:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - name: Elevated service tests
        run: cargo test -p atlas-agent --lib -- --ignored --test-threads=1 --nocapture

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Lint on every run; breaking-change check against the PR base on pull requests (the action's default).
      - uses: bufbuild/buf-action@v1
        with:
          input: crates/atlas-proto/proto
          lint: true
          format: false
          push: false
          archive: false
          pr_comment: false

  powershell:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Install Pester and PSScriptAnalyzer
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -SkipPublisherCheck -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - name: PSScriptAnalyzer
        run: |
          $findings = Invoke-ScriptAnalyzer -Path infra/vm -Recurse -Settings infra/vm/PSScriptAnalyzerSettings.psd1
          $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($findings) { throw "PSScriptAnalyzer: $(@($findings).Count) finding(s)" }
      - name: Pester
        run: |
          Import-Module Pester -RequiredVersion 5.9.1
          $config = New-PesterConfiguration
          $config.Run.Path = 'infra/vm/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - run: cargo audit --file crates/atlas-schema/fuzz/Cargo.lock
      - run: cargo audit --file crates/atlas-buffer/fuzz/Cargo.lock
      - run: cargo audit --file crates/atlas-etw/fuzz/Cargo.lock
