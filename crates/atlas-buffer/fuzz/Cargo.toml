[package]
name = "atlas-buffer-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
atlas-buffer = { path = ".." }
libfuzzer-sys = "0.4"

[[bin]]
name = "buffer_recover"
path = "fuzz_targets/buffer_recover.rs"
test = false
doc = false
bench = false

# Standalone workspace: cargo-fuzz needs nightly + sanitizers, so keep it out
# of the main workspace build.
[workspace]
members = ["."]
